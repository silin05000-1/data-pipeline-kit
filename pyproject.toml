[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "data-pipeline-kit"
version = "0.1.0"
description = "Data cleaning/assembling pipeline with REST API integration and notifications"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
data-pipeline = "pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
